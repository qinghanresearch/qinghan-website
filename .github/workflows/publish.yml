name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set public website URL
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          Path('_quarto-publish.yml').write_text('website:\n  site-url: ' + json.dumps(os.environ['SITE_URL']) + '\n')
          PYTHON
      - name: Render website
        run: quarto render --profile publish
      - name: Upload website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
